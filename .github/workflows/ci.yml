name: CI

# Runs on every pull request and on pushes to main.
# Backend: unit tests. Frontend: type-check and production build.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Every source file parses
        run: |
          for f in server.js controllers/*.js routes/*.js services/*.js utils/*.js middleware/*.js scripts/*.js; do
            node --check "$f"
          done
      - name: Unit tests
        run: npm test

  frontend:
    name: Frontend type-check and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Translation files are valid and in step
        run: node scripts/check-locales.mjs
      - name: Type-check and build
        run: npm run build
